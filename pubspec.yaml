name: melo
description: "Home practice for children, with their parents and therapists."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.3.4
  image_picker: ^1.2.3
  intl: ^0.20.2
  just_audio: ^0.10.6
  lucide_icons_flutter: ^3.1.22
  path_provider: ^2.1.6
  proximity_sensor: ^1.4.0
  record: ^6.2.1
  sensors_plus: ^7.1.1
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/melo-logo.png

  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansGurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansGurmukhi-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansGurmukhi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansGurmukhi-Bold.ttf
          weight: 700
