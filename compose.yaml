services:
  melo-backend:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the https URL clients use}
      USEFUL_WORDS_KEY: ${USEFUL_WORDS_KEY:?set USEFUL_WORDS_KEY to a base64-encoded 32-byte key}
    volumes:
      - melo-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Share loopback with the backend; the model API stays off the public tunnel.
    network_mode: "service:melo-backend"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    network_mode: "service:melo-backend"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "gemma3:4b"]
    restart: on-failure

volumes:
  melo-data:
  ollama-models:
